<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — Zayro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Geist',system-ui,sans-serif;background:#08090C;color:#ECEEF4;display:flex;align-items:center;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased;}
    .card{background:#0F1116;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:40px 36px;width:100%;max-width:400px;margin:20px;}
    .logo{font-size:1.3rem;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;}
    .logo span{color:#C1121F;}
    .badge{display:inline-flex;align-items:center;gap:5px;background:rgba(193,18,31,.1);border:1px solid rgba(193,18,31,.2);border-radius:100px;padding:3px 10px;font-size:.65rem;font-weight:700;color:#C1121F;letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px;}
    h1{font-size:1.2rem;font-weight:800;letter-spacing:-.025em;margin-bottom:6px;}
    .sub{font-size:.8rem;color:rgba(236,238,244,.5);margin-bottom:28px;}
    .field{margin-bottom:14px;}
    label{display:block;font-size:.72rem;font-weight:600;color:rgba(236,238,244,.5);margin-bottom:6px;letter-spacing:.02em;}
    input{width:100%;background:#151820;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 13px;color:#ECEEF4;font-family:inherit;font-size:.88rem;outline:none;transition:border-color .15s;}
    input:focus{border-color:rgba(193,18,31,.5);}
    input::placeholder{color:rgba(236,238,244,.25);}
    .err{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:8px;padding:10px 13px;font-size:.8rem;color:#F87171;margin-bottom:14px;display:none;}
    .btn{width:100%;background:#C1121F;border:none;border-radius:9px;padding:11px;color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;transition:background .14s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
    .btn:hover{background:#C4602A;}
    .btn:disabled{opacity:.6;cursor:default;}
    .back{display:block;text-align:center;margin-top:20px;font-size:.78rem;color:rgba(236,238,244,.4);text-decoration:none;}
    .back:hover{color:rgba(236,238,244,.7);}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Zayro<span>.</span></div>
  <div class="badge"><i class="bi bi-shield-fill-check"></i> Admin access</div>
  <h1>Sign in to admin panel</h1>
  <p class="sub">Only accounts with admin or superadmin role can access this area.</p>
  <div class="err" id="err"></div>
  <form onsubmit="doLogin(event)">
    {% csrf_token %}
    <div class="field">
      <label>Username or email</label>
      <input type="text" id="identifier" placeholder="zayroadmin" autocomplete="username" required/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn" id="submit-btn"><i class="bi bi-shield-lock-fill"></i> Sign in</button>
  </form>
  <a href="/" class="back">← Back to Zayro</a>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Signing in…';
  const res = await fetch('/z-admin/login/', {
    method: 'POST',
    headers: {'Content-Type':'application/json','X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value},
    body: JSON.stringify({identifier: document.getElementById('identifier').value, password: document.getElementById('password').value})
  });
  const data = await res.json();
  if (data.ok) {
    window.location.href = '/z-admin/';
  } else {
    err.textContent = data.error || 'Sign in failed.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-shield-lock-fill"></i> Sign in';
  }
}
</script>
</body>
</html>
