<!-- Global page loader — ink-fill wordmark (ported from ZayroDocX) -->
<div id="globalLoader" class="zl-page show" role="status" aria-live="polite" aria-hidden="false">
  <div class="zl-if-wrap" id="zlIfWrap">
    <span class="zl-if-base">ZayroInvoice</span>
    <span class="zl-if-fill" aria-hidden="true"><span class="zl-zayro">Zayro</span><span class="zl-inv">Invoice</span></span>
  </div>
  <div class="zl-if-label" id="globalLoaderMsg">Loading&hellip;</div>
</div>
<style>
  .zl-page{display:none;position:fixed;inset:0;z-index:10000;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:#F9F8F7;}
  .zl-page.show{display:flex;}
  [data-theme="dark"] .zl-page{background:#0F0F10;}
  .zl-if-wrap{position:relative;font-family:'Geist',system-ui,sans-serif;font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:-.03em;white-space:nowrap;line-height:1.1;}
  .zl-if-base{color:#D3D2CE;}
  [data-theme="dark"] .zl-if-base{color:#2A2A2C;}
  .zl-if-fill{position:absolute;inset:0;overflow:hidden;width:0%;white-space:nowrap;}
  .zl-zayro{color:#131416;}
  [data-theme="dark"] .zl-zayro{color:#EDEDED;}
  .zl-inv{color:#C1121F;}
  .zl-if-wrap.run .zl-if-fill{animation:zlIfWipe 1.4s cubic-bezier(.65,0,.35,1) forwards;}
  @keyframes zlIfWipe{to{width:100%;}}
  .zl-if-label{font-family:'Geist',system-ui,sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#6B6B6B;}
  [data-theme="dark"] .zl-if-label{color:#8A8A8A;}
  @media (prefers-reduced-motion:reduce){.zl-if-wrap.run .zl-if-fill{animation:none;width:100%;}}

  .zl-back-warn{position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(19,20,22,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;}
  .zl-back-warn.show{opacity:1;pointer-events:auto;}
  .zl-bw-card{width:100%;max-width:380px;background:#fff;border-radius:16px;padding:26px 24px 20px;text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.25);transform:translateY(8px) scale(.97);transition:transform .25s cubic-bezier(.16,1,.3,1);
    font-family:'Geist',system-ui,sans-serif;}
  .zl-back-warn.show .zl-bw-card{transform:none;}
  .zl-bw-ic{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:#FEE2E2;color:#C1121F;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
  .zl-bw-t{font-size:1.05rem;font-weight:800;color:#131416;margin-bottom:6px;}
  .zl-bw-s{font-size:.88rem;line-height:1.5;color:#4A4A4A;margin-bottom:18px;}
  .zl-bw-btn{width:100%;height:42px;border:none;border-radius:10px;background:#C1121F;color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;}
  .zl-bw-btn:hover{background:#8C0F1B;}
  .zl-bw-btn:focus-visible{outline:2px solid #C1121F;outline-offset:2px;}
  [data-theme="dark"] .zl-bw-card{background:#1C1D21;}
  [data-theme="dark"] .zl-bw-t{color:#EDEDED;}
  [data-theme="dark"] .zl-bw-s{color:#B8B8B8;}
</style>
<script>
  (function(){
    var el = document.getElementById('globalLoader');
    var wrap = document.getElementById('zlIfWrap');
    var loopId = null, safetyId = null;
    function runInkFill(){ wrap.classList.remove('run'); void wrap.offsetWidth; wrap.classList.add('run'); }
    window.ZLoader = {
      show: function(msg){
        document.getElementById('globalLoaderMsg').textContent = msg || 'Loading…';
        el.classList.add('show'); el.setAttribute('aria-hidden', 'false');
        clearInterval(loopId); runInkFill(); loopId = setInterval(runInkFill, 2200);
        // Never strand the user behind the overlay (e.g. mailto:/download links that don't navigate).
        clearTimeout(safetyId); safetyId = setTimeout(window.ZLoader.hide, 8000);
      },
      hide: function(){
        el.classList.remove('show'); el.setAttribute('aria-hidden', 'true');
        clearInterval(loopId); clearTimeout(safetyId);
      }
    };
    // Opt-in for long actions: <button data-loader data-loader-msg="Generating PDF…">
    document.addEventListener('click', function(e){
      var b = e.target.closest && e.target.closest('[data-loader]');
      if (b) ZLoader.show(b.dataset.loaderMsg || 'Processing…');
    });
    // Page-to-page navigation via normal links (same tab, same site, not downloads/new tabs).
    document.addEventListener('click', function(e){
      if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a || a.target === '_blank' || a.hasAttribute('download')) return;
      var href = a.getAttribute('href');
      if (!href || href.charAt(0) === '#' || /^(javascript|mailto|tel):/i.test(href)) return;
      if (a.origin !== location.origin) return;
      if (a.pathname === location.pathname && a.search === location.search) return;
      setTimeout(function(){ if (!e.defaultPrevented) ZLoader.show('Loading…'); }, 0);
    });
    // Visible from the first paint; runs the ink-fill until the page (images, fonts) has fully loaded.
    var shownAt = Date.now();
    ZLoader.show('Loading…');
    function finish(){ setTimeout(ZLoader.hide, Math.max(0, 450 - (Date.now() - shownAt))); }
    if (document.readyState === 'complete') finish(); else window.addEventListener('load', finish);
    // Refresh (F5 / Ctrl+R / Ctrl+Shift+R / reload button) and any other page leave.
    window.addEventListener('beforeunload', function(){ ZLoader.show('Loading…'); });
    // Coming back via the Back button restores the page from cache — don't leave the overlay up.
    window.addEventListener('pageshow', function(e){ if (e.persisted) ZLoader.hide(); });

    // Block the browser Back/Forward buttons: keep a duplicate entry on top of history and
    // re-add it whenever Back is pressed. Chrome ignores entries added before the user has
    // interacted with the page, so the guard is (re)armed on the first click/tap/key as well.
    function armHistoryGuard(){ history.pushState(history.state, '', location.href); }
    armHistoryGuard();
    ['pointerdown', 'keydown'].forEach(function(ev){
      window.addEventListener(ev, function once(){ armHistoryGuard(); window.removeEventListener(ev, once, true); }, true);
    });
    var warnEl = null, warnTimer = null;
    function backWarning(){
      if (!warnEl) {
        warnEl = document.createElement('div');
        warnEl.className = 'zl-back-warn';
        warnEl.setAttribute('role', 'alertdialog');
        warnEl.setAttribute('aria-live', 'assertive');
        warnEl.innerHTML =
          '<div class="zl-bw-card">' +
            '<div class="zl-bw-ic"><i class="bi bi-exclamation-triangle-fill"></i></div>' +
            '<div class="zl-bw-t">Back button is disabled</div>' +
            '<div class="zl-bw-s">Please don’t use the browser’s back button. Use the menu or the buttons on the page to move around.</div>' +
            '<button type="button" class="zl-bw-btn">OK, got it</button>' +
          '</div>';
        warnEl.addEventListener('click', function(e){
          if (e.target === warnEl || e.target.classList.contains('zl-bw-btn')) warnEl.classList.remove('show');
        });
        document.body.appendChild(warnEl);
      }
      warnEl.classList.add('show');
      warnEl.querySelector('.zl-bw-btn').focus();
      clearTimeout(warnTimer); warnTimer = setTimeout(function(){ warnEl.classList.remove('show'); }, 5000);
    }
    window.addEventListener('popstate', function(){ ZLoader.hide(); armHistoryGuard(); backWarning(); });
  })();
</script>
