<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Register – Zayro ₹ Invoice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --primary:#F97316; --primary-dark:#EA580C; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Inter',system-ui,sans-serif; background:linear-gradient(135deg,#0F172A 0%,#1E293B 100%); min-height:100vh; }

    .lp-nav {
      position:fixed; top:0; left:0; right:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 40px; height:64px;
      background:rgba(15,23,42,.9); backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .lp-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .lp-logo-icon { width:34px; height:34px; background:var(--primary); border-radius:8px; display:flex; align-items:center; justify-content:center; }
    .lp-logo-text { font-size:1.1rem; font-weight:800; color:#fff; letter-spacing:-.02em; }
    .lp-nav-links { display:flex; align-items:center; gap:10px; }
    .btn-nav-outline { padding:7px 18px; border:1.5px solid rgba(255,255,255,.2); border-radius:8px; color:#fff; font-weight:600; font-size:.85rem; text-decoration:none; transition:all .15s; }
    .btn-nav-outline:hover { border-color:#fff; background:rgba(255,255,255,.08); color:#fff; }
    .btn-nav-primary { padding:7px 18px; background:var(--primary); border-radius:8px; color:#fff; font-weight:600; font-size:.85rem; text-decoration:none; transition:background .15s; }
    .btn-nav-primary:hover { background:var(--primary-dark); color:#fff; }

    .page-wrap { min-height:100vh; padding-top:64px; display:flex; align-items:center; justify-content:center; padding-bottom:40px; }

    .auth-card { background:#fff; border-radius:20px; padding:44px 40px; width:100%; max-width:480px; box-shadow:0 24px 64px rgba(0,0,0,.35); }
    .auth-logo-wrap { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .auth-logo-icon { width:40px; height:40px; background:var(--primary); border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .auth-logo-name { font-size:1.5rem; font-weight:900; color:#0F172A; letter-spacing:-.03em; }
    .auth-sub { color:#64748B; font-size:.9rem; margin-bottom:6px; }

    .role-pill { display:inline-flex; align-items:center; gap:6px; background:#F1F5F9; color:#64748B; border-radius:100px; padding:4px 12px; font-size:.78rem; font-weight:600; margin-bottom:24px; }

    .form-label { font-weight:600; font-size:.85rem; color:#374151; margin-bottom:5px; }
    .form-control { border:1.5px solid #E2E8F0; border-radius:8px; padding:10px 14px; font-size:.9rem; transition:border-color .15s; }
    .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(249,115,22,.12); outline:none; }
    .btn-submit { background:var(--primary); border:none; border-radius:10px; padding:12px; font-weight:700; font-size:.95rem; color:#fff; width:100%; transition:background .15s; }
    .btn-submit:hover { background:var(--primary-dark); }
    .btn-submit:disabled { opacity:.7; }

    .strength-bar { height:4px; border-radius:4px; background:#E2E8F0; margin-top:6px; overflow:hidden; }
    .strength-fill { height:100%; border-radius:4px; transition:width .3s,background .3s; width:0; }
    .strength-text { font-size:.72rem; margin-top:4px; }

    .auth-foot { text-align:center; margin-top:20px; font-size:.85rem; color:#64748B; }
    .auth-foot a { color:var(--primary); font-weight:600; text-decoration:none; }
    .auth-foot a:hover { text-decoration:underline; }

    @media (max-width:480px) {
      .lp-nav { padding:0 16px; }
      .auth-card { padding:32px 20px; margin:16px; }
    }
  </style>
</head>
<body>

<nav class="lp-nav">
  <a class="lp-logo" href="/home/">
    <div class="lp-logo-icon"><img src="/static/img/logo.png" alt="logo" style="width:34px;height:34px;object-fit:contain"></div>
    <div class="lp-logo-text">Zayro ₹ Invoice</div>
  </a>
  <div class="lp-nav-links">
    <a href="/auth/login/" class="btn-nav-outline">Login</a>
    <a href="/auth/register/" class="btn-nav-primary">Register</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="auth-card">
    <div class="auth-logo-wrap">
      <div class="auth-logo-icon"><img src="/static/img/logo.png" alt="logo" style="width:40px;height:40px;object-fit:contain"></div>
      <div class="auth-logo-name">Zayro ₹ Invoice</div>
    </div>
    <p class="auth-sub">Create your free account</p>
    <div class="role-pill"><i class="bi bi-person"></i> You'll join as a <strong style="color:#0F172A;margin-left:3px">User</strong> — admin can upgrade your role</div>

    <div id="error-msg" class="alert alert-danger d-none py-2" style="font-size:.85rem;border-radius:8px"></div>
    <div id="success-msg" class="alert alert-success d-none py-2" style="font-size:.85rem;border-radius:8px"></div>

    <form id="register-form">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="username" placeholder="e.g. johndoe" autocomplete="username" required>
        </div>
        <div class="col-12">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="col-12">
          <label class="form-label">Password</label>
          <div style="position:relative">
            <input type="password" class="form-control" id="password" placeholder="Min 8 characters" autocomplete="new-password" required minlength="8" style="padding-right:44px" oninput="checkStrength(this.value)">
            <button type="button" onclick="togglePwd()" tabindex="-1"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94A3B8;cursor:pointer;font-size:.95rem;padding:0">
              <i class="bi bi-eye" id="pwd-eye"></i>
            </button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <div class="strength-text" id="strength-text" style="color:#94A3B8"></div>
        </div>
        <div class="col-12 mt-2">
          <button type="submit" class="btn-submit" id="submit-btn">
            <span id="btn-text">Create Account</span>
            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
          </button>
        </div>
      </div>
    </form>

    <div class="auth-foot">
      Already have an account? <a href="/auth/login/">Sign In</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('access_token')) window.location = '/';

  function togglePwd() {
    const inp = document.getElementById('password');
    const eye = document.getElementById('pwd-eye');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    eye.className = inp.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  }

  function checkStrength(val) {
    const fill = document.getElementById('strength-fill');
    const txt  = document.getElementById('strength-text');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const levels = [
      { w:'0%', c:'#EF4444', t:'' },
      { w:'25%', c:'#EF4444', t:'Weak' },
      { w:'50%', c:'#F59E0B', t:'Fair' },
      { w:'75%', c:'#F97316', t:'Good' },
      { w:'100%', c:'#10B981', t:'Strong' },
    ];
    const l = levels[score];
    fill.style.width = l.w; fill.style.background = l.c;
    txt.textContent = l.t; txt.style.color = l.c;
  }

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error-msg');
    const okEl  = document.getElementById('success-msg');
    errEl.classList.add('d-none'); okEl.classList.add('d-none');
    btn.disabled = true;
    document.getElementById('btn-text').textContent = 'Creating…';
    document.getElementById('btn-spinner').classList.remove('d-none');

    try {
      const res = await fetch('/api/auth/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          email:    document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('access_token',  data.data.tokens.access);
        localStorage.setItem('refresh_token', data.data.tokens.refresh);
        localStorage.setItem('user_email',    data.data.user.email);
        localStorage.setItem('user_username', data.data.user.username);
        localStorage.setItem('user_role',     data.data.user.role);
        localStorage.setItem('user_id',       data.data.user.id);
        okEl.textContent = 'Account created! Redirecting…';
        okEl.classList.remove('d-none');
        setTimeout(() => window.location = '/', 900);
      } else {
        const msg = data.errors ? Object.values(data.errors).flat().join(' ') : data.message;
        errEl.textContent = msg || 'Registration failed.';
        errEl.classList.remove('d-none');
      }
    } catch {
      errEl.textContent = 'Network error. Please try again.';
      errEl.classList.remove('d-none');
    } finally {
      btn.disabled = false;
      document.getElementById('btn-text').textContent = 'Create Account';
      document.getElementById('btn-spinner').classList.add('d-none');
    }
  });
</script>
</body>
</html>
